<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body::before {
        content: "";
        position: fixed;
        inset: 0;
        background: white;
        opacity: 0.95;
        pointer-events: none;
        z-index: -1;
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fdfdfd;
      color: #222;
    }
    body {
        --c: gainsboro;     /* grid line color */
        --d: 1em;            /* grid cell size */
        --l: 1px;            /* line thickness */
        --o: calc(0.5 * var(--l));

        background:
            /* vertical + horizontal lines */
            conic-gradient(from 90deg at var(--l) var(--l), 
                transparent 25%, var(--c) 0%) 
            calc(-1 * var(--o)) calc(-1 * var(--o)) / var(--d) var(--d),

            /* main diagonal */
            linear-gradient(45deg, 
                transparent calc(50% - var(--o)), 
                var(--c) 0 calc(50% + var(--o)), transparent 0) 
            0 0 / calc(2 * var(--d)) calc(2 * var(--d)),

            /* secondary diagonal */
            linear-gradient(-45deg, 
                transparent calc(50% - var(--o)), 
                var(--c) 0 calc(50% + var(--o)), transparent 0) 
            0 0 / calc(2 * var(--d)) calc(2 * var(--d));
    }
    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-content {
      padding: 16px;
    }

    .card-title {
      font-size: 1.25em;
      font-weight: 600;
      margin: 0 0 8px;
    }

    .card-description {
      font-size: 0.95em;
      color: #555;
    }
  </style>
</head>
<body>

  <h1>My Projects</h1>

  <div class="grid">

    <a href="https://boboter.github.io/x-percent-of/" class="card">
        <img src="img/x_percent.png" alt="X% of Preview">
        <div class="card-content">
          <div class="card-title">x% of ...</div>
          <div class="card-description">
            What could be done with just a fraction of global budgets?
          </div>
        </div>
    </a>

    <!-- Weitere Tools folgen hier in gleicher Struktur -->
    <!--
    <a href="another-tool/" class="card">
      <img src="img/another-cover.jpg" alt="Another Tool">
      <div class="card-content">
        <div class="card-title">Another Tool</div>
        <div class="card-description">Kurze Beschreibung des Tools oder Spiels.</div>
      </div>
    </a>
    -->

  </div>

</body>
</html>
