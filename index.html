<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RH</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --c: gainsboro;
      --d: 1em;
      --l: 1px;
      --o: calc(0.5 * var(--l));
    }

    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background-color: #fdfdfd;
      color: #222;
      background:
        conic-gradient(from 90deg at var(--l) var(--l), transparent 25%, var(--c) 0%)
          calc(-1 * var(--o)) calc(-1 * var(--o)) / var(--d) var(--d),
        linear-gradient(45deg, transparent calc(50% - var(--o)), var(--c) 0 calc(50% + var(--o)), transparent 0)
          0 0 / calc(2 * var(--d)) calc(2 * var(--d)),
        linear-gradient(-45deg, transparent calc(50% - var(--o)), var(--c) 0 calc(50% + var(--o)), transparent 0)
          0 0 / calc(2 * var(--d)) calc(2 * var(--d));
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: white;
      opacity: 0.95;
      pointer-events: none;
      z-index: -1;
    }

    h1 {
      text-align: center;
      margin-bottom: 40px;
      font-size: 2.5em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1000px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.06);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
    }

    .card-content {
      padding: 16px;
    }

    .card-title {
      font-size: 1.25em;
      font-weight: 600;
      margin: 0 0 8px;
    }

    .card-description {
      font-size: 0.95em;
      color: #555;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px;
      }
      .card-content {
        padding: 12px;
      }
      .card-title {
        font-size: 1.1em;
      }
      .card-description {
        font-size: 0.9em;
      }
      h1 {
        font-size: 1.8em;
      }
    }
  </style>
</head>
<body>
  <h1>My Projects</h1>
  <div class="grid">
    <a href="https://boboter.github.io/x-percent-of/" class="card">
        <img src="img/x_percent.png" alt="X% of Preview">
        <div class="card-content">
          <div class="card-title">x% of ...</div>
          <div class="card-description">
            What could be done with just a fraction of global budgets?
          </div>
        </div>
    </a>
  </div>
  <script src="https://storage.ko-fi.com/cdn/scripts/overlay-widget.js"></script>
  <script>
    kofiWidgetOverlay.draw('boboter', {
      'type': 'floating-chat',
      'floating-chat.donateButton.text': 'Tip Me',
      'floating-chat.donateButton.background-color': '#fcbf47',
      'floating-chat.donateButton.text-color': '#323842'
    });
  </script>
</body>
</html>
